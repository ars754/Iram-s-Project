<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formatting Example</title>
  <style>
    body {background-color: aquamarine;}
    h1 {
      color: blue;
      text-align: center;
      }
    .red-text { color: red; }
    .large-font { font-size: 20px; }
    .arial-font { font-family: Arial; }
    .bg-yellow { background-color: yellow; }
    .marquee-text {
        animation: scroll-right 15s linear infinite;
        display: inline-block;
        padding: 10px;
      }
    @keyframes scroll-right {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100vw); }
    }
    </style>
</head>
<body>
    <h1><i><b>Formatting Example</b></i></h1><hr/>
    <p>
      1. This is <b>Bold</b>, <i>Italic</i>, <u>Underlined</u> text.<br>
      2. <span class="red-text">This text is red in color.</span><br>
      3. <span class="large-font">Font Size Changed</span><br>
      4. <span class="arial-font">Font Family Changed</span>
    </p>
    <p class="bg-yellow">5. This paragraph has background color.</p>
    <p>6. Line Breaks:<br>Line 1<br>Line 2<br>Line 3</p>
    <p>7. <span class="marquee-text">Marquee Text Example - Scrolling Animation</span></p>
</body>
</html>
