<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lists Example</title>
  <style>
    body {
      background-color: aquamarine;
      font-family: Arial, sans-serif;
      margin: 20px;
      line-height: 1.6;
    }
    h1 { 
      text-align: center;
      color: #333; 
    }
    h2 {
      color: #555;
      margin-top: 20px;
      }
    ol, ul { margin: 10px 0; }
    li { margin: 8px 0; }
    a {
      color: #0066cc;
      text-decoration: none;
      margin: 10px 0;
      display: inline-block;
    }
    a:hover { text-decoration: underline; }
    img {
      max-width: 100%;
      height: auto;
      margin: 15px 0;
      border: 1px solid #ddd;
      padding: 5px;
      }
  </style>
</head>
<body>
  <h1><b><i>Lists and Links Example</i></b></h1><hr/>
  <h2>Ordered List</h2>
    <ol>
      <li>Apple</li>
      <li>Banana</li>
      <li>Orange</li>
    </ol>
  <h2>Unordered List</h2>
    <ul>
      <li>Red</li>
      <li>Blue</li>
      <li>Green</li>
    </ul>
    <h2>Image</h2>
    <img src="https://github.com/ars754/Iram-s-Project/blob/main/1_3Xtw4yP.webp" alt="Sample Image">
    <h2>Links</h2>
    <a href="https://www.perplexity.ai/">External Link</a><br/>
</body>
</html>
