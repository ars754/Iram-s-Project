<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <style>
        body{
            font-family: Arial;
            background:#f0f0f0;
        }
        form{
            background:white;
            width:450px;
            padding:20px;
            margin:auto;
            border-radius:10px;
        }
        input, select{
            width:100%;
            padding:8px;
            margin:8px 0;
        }
    </style>
</head>
<body>
  <form>
    <h2>Student Registration Form</h2>

    Name: <input type="text" required>
    
    Gender:<br>
    Male<input type="radio" name="g">
    Female<input type="radio" name="g"> 
    Other<input type="radio" name="g">
     
    Course:
    <select>
        <option>BCA</option>
        <option>BSc</option>
        <option>B.Com</option>
    </select>

    Hobbies:<br>
    <input type="checkbox"> Reading
    <input type="checkbox"> Sports
    <input type="checkbox"> Music <br><br>

    <input type="reset">
    <input type="submit">
  </form>
</body>
</html>
