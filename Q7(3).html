<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Factorial of a number</title>
</head>
<body> 
  <script>
    let n = parseInt(prompt("Enter a number:"));
    let f = 1;
    for(let i=1; i<=n; i++){
      f *= i;
    }
    alert("Factorial = " + f);
  </script>
</body>
</html>
