<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sum and Average</title>
</head>
<body>
  <h1><i><b>Sum and Average of Positive Numbers</b></i></h1><hr/>
  <button onclick="startPrompt()">Start Entering Numbers</button>
  <p id="result"></p>
  <script>
  function startPrompt() {
    let sum = 0, count = 0, n;
    while (true) {
      n = parseFloat(prompt("Enter a positive number (0 to stop):"));
      if (n === 0) break;
      if (n > 0) {
        sum += n;
        count++;
        }
      }
      let avg = sum / count;
      document.getElementById("result").innerHTML = `Sum = ${sum}<br>Average = ${avg}`;
    }
  </script>
</body>
</html>
