<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration Form</title>
  <style>
    form {
      width: 350px;
      padding: 15px;
      border: 2px solid #444;
      border-radius: 10px;
    }
    label { 
      font-weight: bold; 
    }
  </style>
</head>
<body>
  <h1><i><b>Student Registration Form</b></i></h1><hr/>
  <form>
    <!-- Text Boxes -->
    <label>Name:</label><br/>
    <input type="text" name="name" required><br/><br/>
    <label>Email:</label><br>
    <input type="email" name="email" required><br/><br/>
    <!-- Radio Buttons -->
    <label>Gender:</label><br/>
    Male<input type="radio" name="gender" value="Male">
    Female<input type="radio" name="gender" value="Female">
    Other<input type="radio" name="gender" value="Female"><br/>
    <!-- Checkboxes -->
    <label>Hobbies:</label><br/>
    Sports<input type="checkbox" name="h1">
    Reading<input type="checkbox" name="h2">
    Music<input type="checkbox" name="h3"><br/><br/>
    <!-- Dropdown -->
    <label>Department:</label><br/>
    <select>
      <option>Select</option>
      <option>Computer Science</option>
      <option>Electronics</option>
      <option>Commerce</option>
      <option>Arts</option>
    </select>
    <br/><br/>
    <!-- Buttons -->
    <input type="submit" value="Submit">
    <input type="reset" value="Reset">
  </form>
</body>
</html>
